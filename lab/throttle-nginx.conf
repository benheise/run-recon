# The rate-limiting fixture (Outcrop 1.21, `bench-run-recon.sh throttle`): what a rate-limited
# host looks like to a scan.
#   throttle.test (LAB_THROTTLE_IP)   2 requests a second per client, a burst of 5, then 429
#                                     Too Many Requests. The root page (lab/throttle-www/, made at
#                                     `up`) links 40 pages, each with its own text (the crawl drops
#                                     pages identical to one it has seen), so the crawl and the
#                                     validation pass run into the limit
#   /closed                           the connection is dropped without an answer (nginx 444)
#   HTTPS                             only throttle.test: any other server name is refused in
#                                     the handshake (alert unrecognized_name, ssl_reject_handshake)
# Certificates: lab/tls/modern.* (lab/gen-tls-certs.py); the name does not matter here.
error_log /dev/stderr warn;
events {}
http {
	access_log /dev/stdout;
	limit_req_zone $binary_remote_addr zone=lab:1m rate=2r/s;
	limit_req_status 429;
	server {
		listen 8080;
		listen 8443 ssl;
		server_name throttle.test;
		ssl_certificate     /lab/tls/modern.crt;
		ssl_certificate_key /lab/tls/modern.key;
		location = /closed { return 444; }
		# limit_req runs before the content phase, so the page is a file (a "return" would
		# answer before the limit applies); every path serves it
		root /lab/throttle-www;
		# the root page is not limited, so every run finds the 40 pages; the
		# pages are (2 a second, a burst of 5, then 429)
		location = / { default_type text/html; try_files /index.html =404; }
		location / {
			limit_req zone=lab burst=5 nodelay;
			default_type text/html;
			try_files $uri $uri.html /index.html =404;
		}
	}
	server {
		listen 8443 ssl default_server;
		ssl_reject_handshake on;
	}
}
