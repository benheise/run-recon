# run-recon benchmark lab — web services at PINNED versions behind a vhost-routing
# TLS ingress, reusing WebInventory's regression-farm composition (nginx, WordPress,
# a 120 KB single-page app, a TLS CI service) so the products/CPEs run-recon
# fingerprints line up with what WebInventory's rules expect for the same services.
#
#   lab  : nginx.test wp.test spa.test ci.test          -> accuracy (lab/expected.csv)
#   farm : fNN.farm.test, round-robin over the backends  -> throughput + accuracy under load
#
#   ./bench-run-recon.sh up [--farm 50]   generates farm/DNS files, starts, provisions WP
#   ./bench-run-recon.sh down
#
# Loopback only. The `.test` TLD is reserved for testing (RFC 6761). This is a range
# you own; never point the scanner anywhere else. Config dirs are bind-mounted as
# DIRECTORIES so regenerated files are seen without recreating containers.
services:
  # authoritative DNS for `test.` (Corefile + generated lab.hosts). LAB_DNS_IP picks
  # another loopback address when 127.0.0.1:53 is taken (e.g. by Pi-hole/dnsmasq).
  dns:
    image: coredns/coredns:1.11.1
    restart: unless-stopped
    command: ["-conf", "/lab/Corefile"]
    ports:
      - "${LAB_DNS_IP:-127.0.0.1}:53:53/udp"
      - "${LAB_DNS_IP:-127.0.0.1}:53:53/tcp"
      # BIND (below) listens on :5353 in this container's network: ns.nsec3.test
      - "${LAB_NSEC3_IP:-127.0.0.7}:53:5353/udp"
      - "${LAB_NSEC3_IP:-127.0.0.7}:53:5353/tcp"
    volumes:
      - ./:/lab:ro

  # BIND 9.18, authoritative for the NSEC3-signed nsec3.test (CoreDNS's file plugin cannot
  # serve NSEC3). It shares the dns container's network, so CoreDNS forwards the zone to
  # 127.0.0.1:5353 and the host reaches it as ns.nsec3.test on LAB_NSEC3_IP:53.
  bind:
    image: internetsystemsconsortium/bind9:9.18
    restart: unless-stopped
    network_mode: "service:dns"
    # the image's entrypoint is "named -u bind"; these are its arguments
    command: ["-g", "-c", "/lab/named.conf"]
    volumes:
      - ./:/lab:ro
    depends_on: [dns]

  ingress:
    image: caddy:2.7.6
    restart: unless-stopped
    command: ["caddy", "run", "--config", "/lab/Caddyfile", "--adapter", "caddyfile"]
    # on: every request is logged as JSON with its headers (bench-run-recon.sh policy); the
    # benchmark runs with it off
    environment:
      - LAB_ACCESS_LOG=${LAB_ACCESS_LOG:-off}
    ports:
      - "127.0.0.1:80:80"
      - "127.0.0.1:443:443"
      - "127.0.0.1:8443:8443"   # the alternate-port fixture (--ports)
      # the protected origin (origin.spa.test): every request gets 403, as an origin
      # locked to its CDN's addresses would answer anyone else
      - "${LAB_PROTECTED_IP:-127.0.0.6}:80:8080"
    volumes:
      - ./:/lab:ro
      - caddy_data:/data
    depends_on: [nginx, wordpress, spa, jenkins]

  # TLS-posture fixtures (lab/tls-nginx.conf): one listener per fixture, each on its own
  # loopback address so each name has its own protocol/cipher policy
  tlslab:
    image: nginx:1.21.6
    restart: unless-stopped
    ports:
      - "${LAB_TLS_LEGACY_IP:-127.0.0.9}:443:4431"
      - "${LAB_TLS_FUTURE_IP:-127.0.0.10}:443:4432"
      - "${LAB_TLS_DEFAULT_IP:-127.0.0.11}:443:4433"
      - "${LAB_TLS_MODERN_IP:-127.0.0.12}:443:4434"
    volumes:
      - ./tls-nginx.conf:/etc/nginx/nginx.conf:ro
      - ./:/lab:ro

  # Server: nginx/1.21.6 -> cpe:2.3:a:f5:nginx:1.21.6
  # Also published DIRECTLY on LAB_ORIGIN_IP:80: the "forgotten origin" that answers for
  # nginx.test without the Caddy edge. db.test leaks it (direct.nginx.test, SPF), so
  # --origin must find and verify it; the other backends stay on the container network.
  nginx:
    image: nginx:1.21.6
    restart: unless-stopped
    ports:
      - "${LAB_ORIGIN_IP:-127.0.0.5}:80:80"

  # WordPress 6.4.x on Apache/PHP (provisioned by `up`) -> WordPress/Apache/PHP CPEs
  wordpress:
    image: wordpress:6.4-apache
    restart: unless-stopped
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: lab
      WORDPRESS_DB_PASSWORD: labpass
      WORDPRESS_DB_NAME: labwp
    depends_on: [db]
  db:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: labwp
      MYSQL_USER: lab
      MYSQL_PASSWORD: labpass
      MYSQL_RANDOM_ROOT_PASSWORD: "1"

  # the 120 KB single-bundle SPA (generated at `up`), served by nginx
  spa:
    image: nginx:1.21.6
    restart: unless-stopped
    volumes:
      - ./spa:/usr/share/nginx/html:ro

  # Jenkins LTS: 403 + X-Jenkins header (locked-down CI) -> cpe:2.3:a:jenkins:jenkins
  jenkins:
    image: jenkins/jenkins:2.426.1-lts-jdk17
    restart: unless-stopped

  # ModSecurity v3 + the OWASP Core Rule Set 4.30 at its defaults (paranoia 1, inbound anomaly
  # threshold 5) in front of the ingress: *.crs.test -> LAB_WAF_IP -> CRS -> Caddy (plain HTTP)
  # -> the lab backends. The User-Agent A/B (bench-run-recon.sh ua): CRS rule 913100 blocks
  # scanner User-Agents (nuclei, ffuf's "Fuzz Faster U Fool", feroxbuster, wpscan, whatweb, ...)
  crs:
    image: owasp/modsecurity-crs:4.30.0-nginx-202610180210
    restart: unless-stopped
    environment:
      - BACKEND=http://ingress:80
      - PORT=8080
      - SSL_PORT=8443
      - BLOCKING_PARANOIA=1
      - ANOMALY_INBOUND=5
      - MODSEC_AUDIT_ENGINE=Off
    ports:
      - "${LAB_WAF_IP:-127.0.0.13}:80:8080"
      - "${LAB_WAF_IP:-127.0.0.13}:443:8443"
    depends_on: [ingress]

  # the rate-limiting fixture (lab/throttle-nginx.conf): throttle.test answers 2 requests a
  # second (a burst of 5), then 429; /closed drops the connection without an answer; HTTPS
  # refuses any other server name (unrecognized_name). The run-health check (bench-run-recon.sh
  # throttle) must mark the host throttled.
  throttle:
    image: nginx:1.21.6
    restart: unless-stopped
    ports:
      - "${LAB_THROTTLE_IP:-127.0.0.14}:80:8080"
      - "${LAB_THROTTLE_IP:-127.0.0.14}:443:8443"
    volumes:
      - ./throttle-nginx.conf:/etc/nginx/nginx.conf:ro
      - ./:/lab:ro

volumes:
  caddy_data:
