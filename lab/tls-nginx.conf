# TLS-posture fixtures (run-recon 1.20, `bench-run-recon.sh tls`): one nginx 1.21.6
# (OpenSSL 1.1.1) with a listener per fixture, each published on its own loopback address
# (docker-compose.yml), so every name has its own protocol and cipher policy. Certificates
# come from lab/gen-tls-certs.py at `up` (lab/tls/, gitignored).
#   legacy.tls.test   TLS 1.0-1.2, accepts a NULL (unencrypted) suite when offered only weak
#                     ones, RSA 1024 / SHA-1 certificate. (Debian's OpenSSL 1.1.1 is built
#                     without 3DES and RC4, so NULL-SHA stands in for them: the same WeakCipher.)
#   future.tls.test   TLS 1.2-1.3, a certificate valid from 30 days after `up`
#   default.tls.test  TLS 1.2-1.3, OpenSSL's default subject (O=Internet Widgits Pty Ltd)
#   modern.tls.test   TLS 1.2-1.3, ECDSA P-256: the control
# handshake failures at info level (`docker logs lab-tlslab-1`): what the server saw of each hello
error_log /dev/stderr info;
events {}
http {
	access_log off;
	server {
		listen 4431 ssl;
		server_name legacy.tls.test;
		ssl_certificate     /lab/tls/legacy.crt;
		ssl_certificate_key /lab/tls/legacy.key;
		ssl_protocols TLSv1 TLSv1.1 TLSv1.2;
		# Debian's openssl.cnf sets MinProtocol TLSv1.2 and SECLEVEL 2; the fixture undoes both
		ssl_conf_command MinProtocol TLSv1;
		ssl_ciphers "ECDHE-RSA-AES128-SHA:AES128-SHA:NULL-SHA:@SECLEVEL=0";
		ssl_prefer_server_ciphers on;
		location / { default_type text/plain; return 200 "legacy TLS fixture\n"; }
	}
	server {
		listen 4432 ssl;
		server_name future.tls.test;
		ssl_certificate     /lab/tls/future.crt;
		ssl_certificate_key /lab/tls/future.key;
		ssl_protocols TLSv1.2 TLSv1.3;
		location / { default_type text/plain; return 200 "not-yet-valid certificate fixture\n"; }
	}
	server {
		listen 4433 ssl;
		server_name default.tls.test;
		ssl_certificate     /lab/tls/default.crt;
		ssl_certificate_key /lab/tls/default.key;
		ssl_protocols TLSv1.2 TLSv1.3;
		location / { default_type text/plain; return 200 "default-certificate fixture\n"; }
	}
	server {
		listen 4434 ssl;
		server_name modern.tls.test;
		ssl_certificate     /lab/tls/modern.crt;
		ssl_certificate_key /lab/tls/modern.key;
		ssl_protocols TLSv1.2 TLSv1.3;
		location / { default_type text/plain; return 200 "modern TLS fixture\n"; }
	}
}
