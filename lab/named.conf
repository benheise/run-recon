// BIND for the run-recon lab: authoritative only, for the NSEC3-signed nsec3.test.
// Runs in the dns container's network (docker-compose.yml): CoreDNS forwards the zone
// to 127.0.0.1:5353; the host reaches it as ns.nsec3.test on LAB_NSEC3_IP:53.
options {
    directory "/var/cache/bind";
    listen-on port 5353 { any; };
    listen-on-v6 { none; };
    recursion no;
    allow-transfer { none; };     // zone transfers refused: the zone check's negative case
    dnssec-validation no;
};
zone "nsec3.test" {
    type primary;
    file "/lab/db.nsec3.test.signed";
};
